<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statutory Construction — Case Flashcards</title><style>
:root{--primary:#22406b;--accent:#8e2f4a;--gold:#c9932b;--green:#1e7a46;--light:#f5f6f8;--shadow:0 4px 20px rgba(0,0,0,.12);--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:var(--light);color:#222}
header{background:linear-gradient(135deg,var(--primary),#132a48);color:#fff;padding:24px 32px;text-align:center}
header h1{font-size:1.9rem;margin-bottom:6px}header p{opacity:.85;font-size:.92rem}
.controls{background:#fff;padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:2px solid #e3e3e3;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.search-box{flex:1;min-width:220px;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:.94rem}
.search-box:focus,select:focus{outline:none;border-color:var(--primary)}
select{padding:10px 12px;border:2px solid #ddd;border-radius:8px;background:#fff;font-size:.9rem;cursor:pointer}
button{padding:10px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:.9rem;font-weight:600;cursor:pointer}
button.alt{background:var(--accent)}button:hover{opacity:.9}
.stats{margin-left:auto;font-size:.9rem;color:#666}.stats b{color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding:24px;max-width:1650px;margin:0 auto}
.flashcard{perspective:1400px;height:380px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flashcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.front{border-top:6px solid var(--gold);justify-content:center;text-align:center;gap:13px}
.num{position:absolute;top:10px;left:14px;font-size:.75rem;font-weight:800;color:#bbb}
.front h2{font-size:1.15rem;color:var(--primary);line-height:1.35}.cite{font-size:.85rem;color:#555;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;background:#eef2f8;color:var(--primary);border:1px solid #d6dfec}
.chip.art{background:var(--gold);color:#332300;border-color:#a87c14}.chip.topic{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{font-size:.72rem;color:#aaa;margin-top:auto}
.back{transform:rotateY(180deg);overflow-y:auto;text-align:left;font-size:.845rem;line-height:1.5;border-top:6px solid var(--accent)}
.back h3{font-size:.95rem;color:var(--primary);margin-bottom:6px}
.lbl{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.5px;color:#fff;background:var(--accent);padding:2px 8px;border-radius:4px;margin:10px 0 4px}
.lbl.d{background:var(--primary)}.lbl.r{background:var(--green)}.lbl.b{background:#4a3b8c}
.alac{background:#f7f4fb;border-left:3px solid #4a3b8c;padding:8px 10px;border-radius:0 6px 6px 0;margin-top:4px}
.alac b{color:#4a3b8c}
footer{text-align:center;padding:22px;color:#777;font-size:.82rem}
@media print{.controls,.hint,footer{display:none}.flashcard{height:auto;page-break-inside:avoid}.inner{transform:none!important}.face{position:static;backface-visibility:visible;transform:none!important;box-shadow:none;border:1px solid #ccc;margin-bottom:8px}}

/* ---- Login gate ---- */
#loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--primary),#0d2845);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}
#loginBox{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;width:100%;max-width:380px}
#loginBox h1{font-size:1.3rem;color:var(--primary);margin-bottom:4px;text-align:center}
#loginBox p.sub{font-size:.85rem;color:#777;text-align:center;margin-bottom:20px}
#loginBox label{font-size:.8rem;font-weight:700;color:#444;display:block;margin:12px 0 4px}
#loginBox input{width:100%;padding:11px 12px;border:2px solid #ddd;border-radius:8px;font-size:.95rem}
#loginBox input:focus{outline:none;border-color:var(--primary)}
#loginBtn{width:100%;margin-top:18px;padding:12px;font-size:.95rem}
#loginMsg{margin-top:14px;font-size:.85rem;line-height:1.5;padding:10px 12px;border-radius:8px;display:none}
#loginMsg.error{display:block;background:#fdecea;color:var(--accent)}
#loginMsg.blocked{display:block;background:#fff6e0;color:#7a5600}
#loginMsg.ok{display:block;background:#e7f6ec;color:#1e7a46}
#payBox{margin-top:14px;display:none}
#payBox input{margin-top:6px}
#payBox button{width:100%;margin-top:10px;background:var(--gold);color:#3a2b00}
#loadingMsg{font-size:.85rem;color:#888;text-align:center;margin-top:10px;display:none}
.app-hidden{display:none}
</style></head><body>

<div id="loginOverlay">
<div id="loginBox">
<h1>Statutory Construction</h1>
<p class="sub">Case Flashcards &middot; enter your student ID and password</p>
<label for="loginId">Student ID</label>
<input id="loginId" placeholder="e.g. STU001" autocomplete="username" autocapitalize="characters">
<label for="loginPass">Password</label>
<input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn" onclick="doLogin()">Log in</button>
<div id="loadingMsg">Checking&hellip;</div>
<div id="loginMsg"></div>
<div id="payBox">
<label for="gcashRef">GCash reference number</label>
<input id="gcashRef" placeholder="Reference number">
<button onclick="doSubmitPayment()">Submit payment reference</button>
</div>
</div>
</div>

<div id="app" class="app-hidden">
<div id="warn" style="display:none;background:#b00020;color:#fff;padding:10px 16px;text-align:center;font-weight:600;font-size:.9rem"></div>
<header><h1>Statutory Construction — Case Flashcards</h1>
<p><span id="total">0</span> cases · click a card to flip · switch to <b>Bar Q&amp;A (ALAC)</b> view in the toolbar</p></header>
<div class="controls">
<input class="search-box" id="q" placeholder="Search case, maxim, doctrine, topic…">
<select id="topic"><option value="">All topics</option></select>
<select id="mode"><option value="std">Standard (Doctrine/Facts/Issue/Ruling)</option><option value="alac">Bar Q&amp;A (ALAC method)</option></select>
<button onclick="shuffleCards()">Shuffle</button>
<button class="alt" onclick="flipAll()">Flip all</button>
<button onclick="window.print()">Print</button>
<button onclick="logout()" style="background:#555">Log out</button>
<div class="stats"><span id="attemptsInfo"></span>&nbsp; Showing <b id="cnt">0</b> of <b id="total2">0</b></div>
</div>
<div class="grid" id="grid"></div>
<footer>Study aid only — always read the full text of the decision.<br><span id="foot" style="font-size:.72rem;color:#aaa"></span></footer>
</div>

<script>
// ===== Your deployed Apps Script web app URL (must end with /exec) =====
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzS9-iGL7k9vdlgwb1WlkGDZ4jJBtx1I2nqgwOo4M_s_ksB7YboEEV0I20IiiRRPXATtw/exec';

let DATA = [], order = [], currentId = null;
const $ = id => document.getElementById(id);
const grid = $('grid');
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* ---------- API ---------- */
async function callApi(params){
  const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams(params) });
  const text = await res.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('BAD_RESPONSE'); }
}
function netMsg(err){
  return err && err.message === 'BAD_RESPONSE'
    ? 'The server sent an unexpected reply. In Apps Script: Deploy > Manage deployments > Edit > New version, with access set to "Anyone".'
    : 'Could not reach the server. Check your connection and try again.';
}

/* ---------- login UI ---------- */
function setLoading(on){ $('loadingMsg').style.display = on ? 'block' : 'none'; $('loginBtn').disabled = on; }
function showLoginMsg(text, cls){ const el = $('loginMsg'); el.textContent = text; el.className = cls || 'error'; }
function clearLoginMsg(){ const el = $('loginMsg'); el.textContent = ''; el.className = ''; $('payBox').style.display = 'none'; }

function showApp(result){
  DATA = result.cards || [];
  currentId = result.id;
  order = DATA.map((_, i) => i);
  $('loginOverlay').style.display = 'none';
  $('app').classList.remove('app-hidden');
  $('attemptsInfo').textContent = 'Attempt ' + result.attempts + ' of ' + result.limit + ' (' + result.status + ')';
  $('total').textContent = $('total2').textContent = DATA.length;
  const sel = $('topic'); sel.length = 1;
  [...new Set(DATA.map(c => c.t).filter(Boolean))].sort().forEach(t => {
    const o = document.createElement('option'); o.value = o.textContent = t; sel.appendChild(o);
  });
  $('foot').textContent = 'Loaded ' + DATA.length + ' cards \u00b7 server ' + (result.version || 'OLD');
  const w = $('warn');
  if(!result.version){ w.style.display = 'block'; w.textContent = 'Your Apps Script is still running an OLD version (only ' + DATA.length + ' card). Redeploy the new backend.gs as a NEW deployment and update APPS_SCRIPT_URL.'; }
  else w.style.display = 'none';
  render();
}

async function doLogin(){
  clearLoginMsg();
  const id = $('loginId').value.trim(), password = $('loginPass').value;
  if(!id || !password){ showLoginMsg('Please enter both your ID and password.'); return; }
  setLoading(true);
  try{
    const r = await callApi({ action: 'login', id, password });
    setLoading(false);
    if(r.blocked){ currentId = id; showLoginMsg(r.message, 'blocked'); $('payBox').style.display = 'block'; return; }
    if(!r.ok){ showLoginMsg(r.error || 'Login failed.'); return; }
    try{ sessionStorage.setItem('sc_id', r.id); sessionStorage.setItem('sc_tok', r.token); }catch(e){}
    showApp(r);
  }catch(err){ setLoading(false); showLoginMsg(netMsg(err)); }
}

async function doSubmitPayment(){
  const ref = $('gcashRef').value.trim();
  if(!ref){ showLoginMsg('Enter the GCash reference number first.', 'blocked'); return; }
  if(!currentId) return;
  setLoading(true);
  try{
    const r = await callApi({ action: 'submitPayment', id: currentId, ref });
    setLoading(false);
    if(r.ok){ showLoginMsg(r.message, 'ok'); $('payBox').style.display = 'none'; }
    else { showLoginMsg(r.error || 'Could not submit.', 'blocked'); $('payBox').style.display = 'block'; }
  }catch(err){ setLoading(false); showLoginMsg(netMsg(err), 'blocked'); }
}

function logout(){
  try{ sessionStorage.removeItem('sc_id'); sessionStorage.removeItem('sc_tok'); }catch(e){}
  DATA = []; order = []; grid.innerHTML = '';
  $('loginPass').value = ''; clearLoginMsg();
  $('app').classList.add('app-hidden');
  $('loginOverlay').style.display = 'flex';
}

// Refreshing the page re-opens the session WITHOUT using another attempt.
async function resumeSession(){
  let id, tok;
  try{ id = sessionStorage.getItem('sc_id'); tok = sessionStorage.getItem('sc_tok'); }catch(e){}
  if(!id || !tok) return;
  try{
    const r = await callApi({ action: 'resume', id, token: tok });
    if(r.ok) showApp(r); else logout();
  }catch(err){ /* stay on login screen */ }
}

['loginId','loginPass'].forEach(k => $(k).addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); }));

/* ---------- cards ---------- */
const sec = (label, cls, text) => text ? `<div class="lbl ${cls}">${label}</div><div>${esc(text)}</div>` : '';

function buildBack(c, mode){
  const head = `<h3>${esc(c.n)} <span style="font-weight:400;font-size:.8rem;color:#666">(${esc(c.c)})</span></h3>
<div><span class="chip art">${esc(c.a)}</span> <span class="chip topic">${esc(c.t)}</span></div>`;
  if(mode === 'alac'){
    const alac = (c.A || c.lb || c.ap || c.cn)
      ? `<div class="alac"><b>Answer:</b> ${esc(c.A)}<br><b>Legal Basis:</b> ${esc(c.lb)}<br><b>Application:</b> ${esc(c.ap)}<br><b>Conclusion:</b> ${esc(c.cn)}</div>`
      : '';
    return head + sec('BAR Q&amp;A — ALAC', 'b', c.q || c.i) + alac;
  }
  return head + sec('DOCTRINE','d',c.d) + sec('FACTS','',c.f) + sec('ISSUE','',c.i) + sec('RULING','r',c.r);
}

function card(c, i){
  const mode = $('mode').value;
  return `<div class="flashcard" onclick="this.classList.toggle('flipped')"><div class="inner">
<div class="face front"><div class="num">#${esc(c.no || i + 1)}</div>
<div class="chips"><span class="chip art">${esc(c.a)}</span><span class="chip topic">${esc(c.t)}</span></div>
<h2>${esc(c.n)}</h2><div class="cite">${esc(c.c)}</div>
<div class="hint">click to reveal ${mode === 'alac' ? 'Bar Q&amp;A (ALAC)' : 'doctrine, ruling &amp; facts'}</div></div>
<div class="face back">${buildBack(c, mode)}</div>
</div></div>`;
}

function render(){
  const q = $('q').value.toLowerCase().trim(), t = $('topic').value;
  let h = '', n = 0;
  order.forEach(i => {
    const c = DATA[i]; if(!c) return;
    const blob = [c.n,c.c,c.a,c.t,c.d,c.f,c.i,c.r,c.q,c.lb,c.ap,c.cn].filter(Boolean).join(' ').toLowerCase();
    if(q && !blob.includes(q)) return;
    if(t && c.t !== t) return;
    h += card(c, i); n++;
  });
  grid.innerHTML = h || '<p style="padding:40px;color:#777;grid-column:1/-1;text-align:center">No cards match your filter.</p>';
  $('cnt').textContent = n;
}
function shuffleCards(){ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} render(); }
function flipAll(){ const cs=document.querySelectorAll('.flashcard'); const any=[...cs].some(c=>!c.classList.contains('flipped')); cs.forEach(c=>c.classList.toggle('flipped',any)); }
$('q').addEventListener('input', render);
$('topic').addEventListener('change', render);
$('mode').addEventListener('change', render);

resumeSession();
</script>
</body></html>
